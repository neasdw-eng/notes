<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes App - Tests</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
  background: #0a0a0f;
  color: #c8b060;
  padding: 24px;
}
h1 { font-size: 18px; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 2px; }
h2 { font-size: 14px; margin: 16px 0 8px; color: #7a6a30; text-transform: uppercase; letter-spacing: 1px; }
.test-result {
  padding: 6px 12px;
  margin: 2px 0;
  border-left: 3px solid #333;
  font-size: 13px;
  line-height: 1.6;
}
.test-result.pass { border-left-color: #00c853; color: #00c853; }
.test-result.fail { border-left-color: #ff3b30; color: #ff3b30; }
.summary {
  margin-top: 24px;
  padding: 12px;
  border: 1px solid #2a2a1e;
  font-size: 14px;
}
.summary.all-pass { border-color: #00c853; color: #00c853; }
.summary.has-fail { border-color: #ff3b30; color: #ff3b30; }
iframe { display: none; }
</style>
</head>
<body>
<h1>Notes App Test Suite</h1>
<div id="test-output"></div>
<div id="summary"></div>
<iframe id="app-frame" src="about:blank" width="1280" height="720"></iframe>
<script src="modules/image-processor.js"></script>
<script src="modules/dx-renderer.js"></script>
<script src="tests.js"></script>
</body>
</html>
