<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>
<style>
/* ========== CSS RESET & BASE ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Light theme (default) */
  --bg-sidebar: #f5f5f5;
  --bg-editor: #ffffff;
  --bg-note-item: transparent;
  --bg-note-item-active: #e0e0e0;
  --bg-note-item-hover: #eaeaea;
  --text-primary: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-editor: #1d1d1f;
  --border-color: #d1d1d6;
  --accent: #007aff;
  --accent-hover: #005ecb;
  --btn-bg: #e5e5ea;
  --btn-hover: #d1d1d6;
  --btn-text: #1d1d1f;
  --danger: #ff3b30;
  --scrollbar-thumb: #c1c1c6;
  --toolbar-bg: #f5f5f5;
  --search-bg: #e5e5ea;
  --search-text: #1d1d1f;
  --placeholder: #8e8e93;
  --scanline-opacity: 0;
  --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
  --editor-font: var(--font-family);
  --glow: none;
  --border-style: 1px solid var(--border-color);
}

/* Dark theme */
[data-theme="dark"] {
  --bg-sidebar: #1c1c1e;
  --bg-editor: #000000;
  --bg-note-item-active: #3a3a3c;
  --bg-note-item-hover: #2c2c2e;
  --text-primary: #f5f5f7;
  --text-secondary: #98989d;
  --text-editor: #f5f5f7;
  --border-color: #38383a;
  --accent: #0a84ff;
  --accent-hover: #409cff;
  --btn-bg: #2c2c2e;
  --btn-hover: #3a3a3c;
  --btn-text: #f5f5f7;
  --scrollbar-thumb: #48484a;
  --toolbar-bg: #1c1c1e;
  --search-bg: #2c2c2e;
  --search-text: #f5f5f7;
  --placeholder: #636366;
}

/* Deus Ex theme */
[data-theme="deusex"] {
  --bg-sidebar: #080810;
  --bg-editor: #04040c;
  --bg-note-item-active: #14142a;
  --bg-note-item-hover: #0c0c1a;
  --text-primary: #c8a832;
  --text-secondary: #6a5a28;
  --text-editor: #40e8a0;
  --border-color: #2a2a3a;
  --accent: #c8a832;
  --accent-hover: #e0c050;
  --btn-bg: #10101c;
  --btn-hover: #1a1a2a;
  --btn-text: #c8a832;
  --danger: #ff4040;
  --scrollbar-thumb: #2a2a3a;
  --toolbar-bg: #0a0a14;
  --search-bg: #10101c;
  --search-text: #c8a832;
  --placeholder: #3a3a50;
  --scanline-opacity: 0.06;
  --editor-font: var(--font-mono);
  --glow: 0 0 10px rgba(200, 168, 50, 0.3);
  --border-style: 1px solid #2a2a3a;
  --dx-blue: #3a5a9a;
  --dx-blue-bright: #5080d0;
  --dx-purple: #4a3a8a;
  --dx-chrome-top: #5a6a8a;
  --dx-chrome-bottom: #2a3040;
  --dx-green: #40e8a0;
  --dx-cyan: #00d4ff;
  --dx-bevel-light: #4a5a70;
  --dx-bevel-dark: #0a0a14;
}

/* Deus Ex animations */
@keyframes deusex-flicker {
  0%, 94%, 100% { opacity: 1; }
  95% { opacity: 0.97; }
  96% { opacity: 0.99; }
  97% { opacity: 0.96; }
  98% { opacity: 1; }
}

@keyframes deusex-glow-pulse {
  0%, 100% { box-shadow: inset 0 0 40px rgba(0, 212, 255, 0.02); }
  50% { box-shadow: inset 0 0 80px rgba(0, 212, 255, 0.05); }
}

@keyframes deusex-border-scan {
  0% { background-position: 0% 0%; }
  100% { background-position: 0% 200%; }
}

@keyframes deusex-text-glow {
  0%, 100% { text-shadow: 0 0 4px rgba(64, 232, 160, 0.3); }
  50% { text-shadow: 0 0 8px rgba(64, 232, 160, 0.5), 0 0 16px rgba(64, 232, 160, 0.15); }
}

/* ---- Deus Ex: App shell ---- */
[data-theme="deusex"] .app {
  animation: deusex-flicker 5s infinite;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 1px,
      rgba(60, 80, 120, 0.03) 1px,
      rgba(60, 80, 120, 0.03) 2px
    ),
    linear-gradient(135deg, #04040c 0%, #08081a 100%);
}

/* ---- Deus Ex: Sidebar (window chrome style) ---- */
[data-theme="deusex"] .sidebar {
  position: relative;
  background: #080810;
  border-right: 2px solid #2a2a3a;
  box-shadow:
    inset -1px 0 0 #1a1a2a,
    1px 0 8px rgba(0, 0, 0, 0.5);
}

[data-theme="deusex"] .sidebar::before {
  content: '';
  position: absolute;
  top: 0; right: -2px;
  width: 2px;
  height: 100%;
  background: linear-gradient(180deg, transparent 0%, rgba(80, 128, 208, 0.4) 30%, rgba(80, 128, 208, 0.4) 70%, transparent 100%);
  z-index: 1;
}

/* ---- Deus Ex: Sidebar header (title bar like Quick Stop) ---- */
[data-theme="deusex"] .sidebar-header {
  position: relative;
  padding: 0;
  gap: 0;
  border-bottom: 2px solid #2a2a3a;
  overflow: hidden;
}

[data-theme="deusex"] .sidebar-title-row {
  background: linear-gradient(180deg, #4a5a7a 0%, #2a3454 40%, #1a2040 60%, #2a3454 100%);
  padding: 8px 12px;
  border-bottom: 1px solid #5a6a8a;
  box-shadow:
    inset 0 1px 0 rgba(120, 150, 200, 0.3),
    inset 0 -1px 0 rgba(0, 0, 0, 0.4);
}

[data-theme="deusex"] .sidebar-header .search-box {
  margin: 8px;
  width: calc(100% - 16px);
  border: 2px solid;
  border-color: #0a0a14 #3a3a4a #3a3a4a #0a0a14;
  background: #06060e;
  border-radius: 0;
  box-shadow:
    inset 0 1px 3px rgba(0, 0, 0, 0.5),
    0 1px 0 rgba(60, 80, 120, 0.1);
}

[data-theme="deusex"] .sidebar-header::after {
  content: '// UNATCO SECURE TERMINAL v2.31 // ENCRYPTED';
  display: block;
  font-size: 8px;
  color: #2a3a50;
  font-family: var(--font-mono);
  letter-spacing: 1.5px;
  padding: 2px 12px 6px;
  text-transform: uppercase;
}

/* ---- Deus Ex: Editor toolbar (window chrome) ---- */
[data-theme="deusex"] .editor-toolbar {
  position: relative;
  background: linear-gradient(180deg, #3a4a6a 0%, #1e2844 40%, #141e34 60%, #1e2844 100%);
  border-bottom: 2px solid #2a2a3a;
  box-shadow:
    inset 0 1px 0 rgba(120, 150, 200, 0.25),
    inset 0 -1px 0 rgba(0, 0, 0, 0.5);
  min-height: 36px;
  padding: 4px 12px;
}

[data-theme="deusex"] .editor-toolbar::after {
  content: '';
  position: absolute;
  bottom: -2px; left: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, rgba(80, 128, 208, 0.5) 50%, transparent 100%);
}

/* ---- Deus Ex: Editor pane ---- */
[data-theme="deusex"] .editor-pane {
  animation: deusex-glow-pulse 8s ease-in-out infinite;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(40, 60, 100, 0.08) 0%, transparent 60%),
    linear-gradient(180deg, #06061a 0%, #04040c 100%);
}

html, body {
  height: 100%;
  font-family: var(--font-family);
  background: var(--bg-editor);
  color: var(--text-primary);
  overflow: hidden;
}

/* ========== LAYOUT ========== */
.app {
  display: flex;
  height: 100vh;
  position: relative;
}

/* Scanline overlay for Deus Ex */
.app::after {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, var(--scanline-opacity)) 2px,
      rgba(0, 0, 0, var(--scanline-opacity)) 4px
    );
  pointer-events: none;
  z-index: 9999;
}

/* CRT vignette for Deus Ex */
[data-theme="deusex"]::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(0, 0, 10, 0.4) 100%);
  pointer-events: none;
  z-index: 9998;
}

/* ========== SIDEBAR ========== */
.sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--bg-sidebar);
  border-right: var(--border-style);
  display: flex;
  flex-direction: column;
  height: 100%;
}

.sidebar-header {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  border-bottom: var(--border-style);
}

.sidebar-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sidebar-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.3px;
}

[data-theme="deusex"] .sidebar-title {
  text-shadow: var(--glow);
  text-transform: uppercase;
  letter-spacing: 2px;
  font-family: var(--font-mono);
  font-size: 16px;
}

.sidebar-actions {
  display: flex;
  gap: 6px;
}

.btn {
  background: var(--btn-bg);
  color: var(--btn-text);
  border: none;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s;
  font-family: inherit;
}

.btn:hover { background: var(--btn-hover); }

.btn-new {
  background: var(--accent);
  color: white;
  font-weight: 600;
}

.btn-new:hover { background: var(--accent-hover); }

[data-theme="deusex"] .btn {
  border-radius: 0;
  border: 2px solid;
  border-color: #5a6a8a #1a1a2a #1a1a2a #5a6a8a;
  text-transform: uppercase;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1px;
  background: linear-gradient(180deg, #2a3454 0%, #141e34 100%);
  color: #b0c4e8;
  padding: 5px 10px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

[data-theme="deusex"] .btn:hover {
  border-color: #7a8aaa #2a2a3a #2a2a3a #7a8aaa;
  background: linear-gradient(180deg, #3a4a6a 0%, #1e2844 100%);
  color: #d0e0ff;
}

[data-theme="deusex"] .btn:active {
  border-color: #1a1a2a #5a6a8a #5a6a8a #1a1a2a;
  background: linear-gradient(180deg, #141e34 0%, #2a3454 100%);
}

[data-theme="deusex"] .btn.btn-new {
  background: linear-gradient(180deg, #5a6a30 0%, #3a4a18 100%);
  border-color: #8a9a50 #2a2a14 #2a2a14 #8a9a50;
  color: #d0e0a0;
}

[data-theme="deusex"] .btn.btn-new:hover {
  background: linear-gradient(180deg, #6a7a38 0%, #4a5a20 100%);
  border-color: #9aaa60 #3a3a1a #3a3a1a #9aaa60;
  color: #e0f0b0;
}

.search-box {
  width: 100%;
  padding: 8px 12px;
  background: var(--search-bg);
  border: none;
  border-radius: 8px;
  color: var(--search-text);
  font-size: 13px;
  outline: none;
  font-family: inherit;
}

.search-box::placeholder { color: var(--placeholder); }

[data-theme="deusex"] .search-box {
  border-radius: 0;
  border: 2px solid;
  border-color: #0a0a14 #3a3a4a #3a3a4a #0a0a14;
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.5px;
  color: #40e8a0;
  text-shadow: 0 0 4px rgba(64, 232, 160, 0.2);
}

[data-theme="deusex"] .search-box:focus {
  border-color: #0a0a14 #5080d0 #5080d0 #0a0a14;
  box-shadow: inset 0 0 8px rgba(80, 128, 208, 0.1);
}

/* Note list */
.note-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.note-list::-webkit-scrollbar { width: 6px; }
.note-list::-webkit-scrollbar-track { background: transparent; }
.note-list::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border-radius: 3px;
}

.note-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 2px;
  transition: background 0.1s;
  background: var(--bg-note-item);
}

.note-item:hover { background: var(--bg-note-item-hover); }
.note-item.active { background: var(--bg-note-item-active); }

[data-theme="deusex"] .note-item {
  border-radius: 2px;
  border-left: 2px solid transparent;
}

[data-theme="deusex"] .note-item.active {
  border-left-color: var(--accent);
}

.note-item-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}

.note-item-preview {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.note-item-date {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 2px;
}

[data-theme="deusex"] .note-item {
  border-radius: 0;
  border-left: 3px solid transparent;
  margin-bottom: 1px;
  padding: 8px 10px;
  transition: all 0.1s;
  position: relative;
}

[data-theme="deusex"] .note-item:hover {
  border-left-color: #3a5a9a;
  background: rgba(40, 60, 100, 0.12);
}

[data-theme="deusex"] .note-item.active {
  border-left-color: #5080d0;
  background: linear-gradient(90deg, rgba(40, 60, 120, 0.2) 0%, rgba(40, 60, 120, 0.05) 100%);
  box-shadow: inset 0 0 12px rgba(80, 128, 208, 0.06);
}

[data-theme="deusex"] .note-item.active::after {
  content: '\25B6';
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 8px;
  color: #5080d0;
}

[data-theme="deusex"] .note-item-title {
  font-family: var(--font-mono);
  font-size: 12px;
  color: #b0c4e8;
  letter-spacing: 0.3px;
}

[data-theme="deusex"] .note-item.active .note-item-title {
  color: #d0e0ff;
  text-shadow: 0 0 6px rgba(80, 128, 208, 0.3);
}

[data-theme="deusex"] .note-item-preview {
  font-family: var(--font-mono);
  font-size: 10px;
  color: #4a5a70;
}

[data-theme="deusex"] .note-item-date {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.5px;
  color: #3a4a5a;
  text-transform: uppercase;
}

/* ========== EDITOR ========== */
.editor-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--bg-editor);
}

.editor-toolbar {
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: var(--border-style);
  background: var(--toolbar-bg);
  min-height: 44px;
}

.editor-toolbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.editor-toolbar-right {
  display: flex;
  align-items: center;
  gap: 6px;
}

.note-title-display {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

.save-indicator {
  font-size: 11px;
  color: var(--text-secondary);
  padding: 2px 8px;
  border-radius: 4px;
  transition: opacity 0.3s;
}

.save-indicator.saving { color: var(--accent); }

.btn-delete {
  background: transparent;
  color: var(--danger);
  padding: 4px 8px;
  font-size: 12px;
}

.btn-delete:hover {
  background: rgba(255, 59, 48, 0.1);
}

.theme-select {
  background: var(--btn-bg);
  color: var(--btn-text);
  border: none;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  outline: none;
}

[data-theme="deusex"] .theme-select {
  border-radius: 0;
  border: 2px solid;
  border-color: #5a6a8a #1a1a2a #1a1a2a #5a6a8a;
  font-family: var(--font-mono);
  text-transform: uppercase;
  background: linear-gradient(180deg, #2a3454 0%, #141e34 100%);
  color: #b0c4e8;
  font-size: 10px;
  letter-spacing: 1px;
  padding: 4px 8px;
}

.editor-container {
  flex: 1;
  display: flex;
  overflow: hidden;
}

.editor-textarea {
  width: 100%;
  height: 100%;
  border: none;
  outline: none;
  resize: none;
  padding: 24px 32px;
  font-size: 15px;
  line-height: 1.7;
  color: var(--text-editor);
  background: var(--bg-editor);
  font-family: var(--editor-font);
}

.editor-textarea::placeholder { color: var(--placeholder); }

[data-theme="deusex"] .editor-textarea {
  animation: deusex-text-glow 4s ease-in-out infinite;
  caret-color: #40e8a0;
  font-size: 14px;
  line-height: 1.8;
  letter-spacing: 0.5px;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 27px,
      rgba(60, 80, 120, 0.04) 27px,
      rgba(60, 80, 120, 0.04) 28px
    ),
    radial-gradient(ellipse at 50% 50%, rgba(40, 60, 100, 0.06) 0%, transparent 70%),
    #04040c;
  padding: 20px 28px;
}

[data-theme="deusex"] .editor-textarea::placeholder {
  text-shadow: none;
  color: #2a3a4a;
}

[data-theme="deusex"] .note-title-display {
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-size: 11px;
  color: #b0c4e8;
  text-shadow: 0 0 6px rgba(80, 128, 208, 0.4);
}

[data-theme="deusex"] .save-indicator {
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-size: 9px;
  color: #40e8a0;
}

[data-theme="deusex"] .btn-delete {
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-size: 9px;
  border-radius: 0;
  border: 2px solid;
  border-color: #8a3030 #2a0a0a #2a0a0a #8a3030;
  background: linear-gradient(180deg, #4a1a1a 0%, #2a0a0a 100%);
  color: #e08080;
  padding: 3px 8px;
}

[data-theme="deusex"] .btn-delete:hover {
  background: linear-gradient(180deg, #5a2a2a 0%, #3a1a1a 100%);
  border-color: #aa4040 #3a1a1a #3a1a1a #aa4040;
  color: #ff9090;
}

/* Empty state */
.empty-state {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  font-size: 16px;
}

[data-theme="deusex"] .empty-state {
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 3px;
  font-size: 12px;
  color: #2a3a50;
  text-shadow: 0 0 8px rgba(80, 128, 208, 0.15);
}

[data-theme="deusex"] .note-count {
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-size: 9px;
  color: #2a3a50;
  border-top: 2px solid #1a1a2a;
  background: linear-gradient(180deg, #0a0a14 0%, #080810 100%);
}

/* Deus Ex scrollbars */
[data-theme="deusex"] .editor-textarea::-webkit-scrollbar { width: 10px; }
[data-theme="deusex"] .editor-textarea::-webkit-scrollbar-track {
  background: #08081a;
  border-left: 1px solid #2a2a3a;
}
[data-theme="deusex"] .editor-textarea::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #3a4a6a, #1e2844);
  border: 1px solid #4a5a7a;
  border-radius: 0;
}
[data-theme="deusex"] .note-list::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #3a4a6a, #1e2844);
  border-radius: 0;
}

/* Note count */
.note-count {
  padding: 12px 16px;
  font-size: 11px;
  color: var(--text-secondary);
  border-top: var(--border-style);
  text-align: center;
}

/* ============================================================
   MASS EFFECT THEME
   Holographic blue/orange UI inspired by the Normandy bridge
   ============================================================ */
[data-theme="masseffect"] {
  --bg-sidebar: #0a0e1a;
  --bg-editor: #060a14;
  --bg-note-item-active: #12203a;
  --bg-note-item-hover: #0e1828;
  --text-primary: #e0e8ff;
  --text-secondary: #6080b0;
  --text-editor: #c0d8ff;
  --border-color: #1a2a4a;
  --accent: #00a8ff;
  --accent-hover: #40c0ff;
  --btn-bg: #101828;
  --btn-hover: #182438;
  --btn-text: #a0c0e8;
  --danger: #ff4040;
  --scrollbar-thumb: #1a2a4a;
  --toolbar-bg: #0c1220;

<body>
<div class="app" data-theme="light">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title-row">
        <span class="sidebar-title">Notes</span>
        <div class="sidebar-actions">
          <button class="btn btn-new" id="btn-new" title="New Note">+ New</button>
        </div>
      </div>
      <input type="text" class="search-box" id="search-box" placeholder="Search notes...">
    </div>
    <div class="note-list" id="note-list"></div>
    <div class="note-count" id="note-count"></div>
  </aside>

  <!-- Editor -->
  <main class="editor-pane">
    <div class="editor-toolbar">
      <div class="editor-toolbar-left">
        <span class="note-title-display" id="note-title-display"></span>
        <span class="save-indicator" id="save-indicator"></span>
      </div>
      <div class="editor-toolbar-right">
        <select class="theme-select" id="theme-select" title="Theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="deusex">Deus Ex</option>
          <option value="masseffect">Mass Effect</option>
          <option value="startrek">Star Trek TNG</option>
          <option value="twinpeaks">Twin Peaks</option>
          <option value="peanuts">Peanuts</option>
          <option value="warcraft">Warcraft</option>
        </select>
        <select class="theme-select" id="reflect-style" title="Reflection Style" style="display:none">
          <option value="terminal">Terminal</option>
          <option value="polygon">Polygon</option>
          <option value="wireframe">Wireframe</option>
        </select>
        <button class="btn btn-reflection" id="btn-reflection" title="Toggle webcam reflection (Deus Ex only)" style="display:none">Reflect</button>
        <button class="btn btn-delete" id="btn-delete" title="Delete Note">Delete</button>
      </div>
    </div>
    <div class="editor-container" id="editor-container">
      <div class="empty-state" id="empty-state">Select a note or create a new one</div>
    </div>
  </main>
</div>

<script src="modules/webcam.js"></script>
<script src="modules/image-processor.js"></script>
<script src="modules/dx-renderer.js"></script>
<script>
// ========== STORAGE LAYER ==========
// All data stays in localStorage — nothing goes over a wire.
// Future: encrypt with Web Crypto API before storing (P1 security).
// Future: reminders stored per-note, synced via service worker push (P1 reminders).

const Storage = {
  KEY: 'notes_app_data',
  THEME_KEY: 'notes_app_theme',

  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  },

  save(notes) {
    localStorage.setItem(this.KEY, JSON.stringify(notes));
  },

  getTheme() {
    return localStorage.getItem(this.THEME_KEY) || 'light';
  },

  setTheme(theme) {
    localStorage.setItem(this.THEME_KEY, theme);
  }
};

// ========== APP STATE ==========
class NotesApp {
  constructor() {
    this.notes = Storage.load();
    this.activeNoteId = null;
    this.saveTimeout = null;
    this.searchQuery = '';

    // DOM refs
    this.els = {
      app: document.querySelector('.app'),
      noteList: document.getElementById('note-list'),
      noteCount: document.getElementById('note-count'),
      btnNew: document.getElementById('btn-new'),
      btnDelete: document.getElementById('btn-delete'),
      searchBox: document.getElementById('search-box'),
      editorContainer: document.getElementById('editor-container'),
      emptyState: document.getElementById('empty-state'),
      titleDisplay: document.getElementById('note-title-display'),
      saveIndicator: document.getElementById('save-indicator'),
      themeSelect: document.getElementById('theme-select'),
    };

    this.reflectionActive = false;
    this.els.btnReflection = document.getElementById('btn-reflection');
    this.els.reflectStyle = document.getElementById('reflect-style');

    // Theme reflection configs: theme → { substyles: [{name, label, processorStyle, renderStyle, colorMode}], defaultOpacity, blendMode }
    this.themeReflectionConfig = {
      deusex: {
        substyles: [
          { name: 'terminal', label: 'Terminal', processorStyle: 'terminal', renderStyle: 'terminal', colorMode: 'green' },
          { name: 'polygon', label: 'Polygon', processorStyle: 'polygon', renderStyle: 'polygon', colorMode: 'green' },
          { name: 'wireframe', label: 'Wireframe', processorStyle: 'wireframe', renderStyle: 'wireframe', colorMode: 'cyan' }
        ],
        defaultOpacity: 0.35, blendMode: 'screen'
      },
      masseffect: {
        substyles: [
          { name: 'paragon', label: 'Paragon', processorStyle: 'paragon', renderStyle: 'paragon', colorMode: 'meblue' },
          { name: 'renegade', label: 'Renegade', processorStyle: 'renegade', renderStyle: 'renegade', colorMode: 'mered' }
        ],
        defaultOpacity: 0.30, blendMode: 'screen'
      },
      startrek: {
        substyles: [
          { name: 'lcars', label: 'LCARS', processorStyle: 'lcars', renderStyle: 'lcars', colorMode: 'lcars' },
          { name: 'holodeck', label: 'Holodeck', processorStyle: 'holodeck', renderStyle: 'holodeck', colorMode: 'holodeck' }
        ],
        defaultOpacity: 0.25, blendMode: 'screen'
      },
      twinpeaks: {
        substyles: [
          { name: 'blacklodge', label: 'Black Lodge', processorStyle: 'blacklodge', renderStyle: 'blacklodge', colorMode: 'redroom' },
          { name: 'owls', label: 'The Owls', processorStyle: 'owls', renderStyle: 'owls', colorMode: 'owlgray' }
        ],
        defaultOpacity: 0.30, blendMode: 'screen'
      },
      peanuts: {
        substyles: [
          { name: 'cartoon', label: 'Cartoon', processorStyle: 'cartoon', renderStyle: 'cartoon', colorMode: 'cartoon' },
          { name: 'sketch', label: 'Sketch', processorStyle: 'sketch', renderStyle: 'sketch', colorMode: 'pencil' }
        ],
        defaultOpacity: 0.25, blendMode: 'multiply'
      },
      warcraft: {
        substyles: [
          { name: 'alliance', label: 'Alliance', processorStyle: 'alliance', renderStyle: 'alliance', colorMode: 'wowblue' },
          { name: 'horde', label: 'Horde', processorStyle: 'horde', renderStyle: 'horde', colorMode: 'wowred' }
        ],
        defaultOpacity: 0.30, blendMode: 'screen'
      }
    };

    // Audio engine
    this.audioCtx = null;
    this.audioNodes = {};
    this.audioActive = false;

    // Visual effects
    this.visualFxActive = false;
    this.visualFxEl = null;
    this.visualFxAnimId = null;

    this.init();
  }

  init() {
    // Load theme
    const savedTheme = Storage.getTheme();
    this.els.app.dataset.theme = savedTheme;
    this.els.themeSelect.value = savedTheme;

    // Event listeners
    this.els.btnNew.addEventListener('click', () => this.createNote());
    this.els.btnDelete.addEventListener('click', () => this.deleteActiveNote());
    this.els.searchBox.addEventListener('input', (e) => {
      this.searchQuery = e.target.value.toLowerCase();
      this.renderNoteList();
    });
    this.els.themeSelect.addEventListener('change', (e) => {
      this.setTheme(e.target.value);
    });
    this.els.btnReflection.addEventListener('click', () => this.toggleReflection());
    this.els.reflectStyle.addEventListener('change', (e) => {
      this.setReflectionStyle(e.target.value);
      // If reflection is active, restart with new style
      if (this.reflectionActive) {
        this.stopReflection();
        this.startReflection();
      }
    });

    // Keyboard shortcut: Ctrl/Cmd+N for new note
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
        e.preventDefault();
        this.createNote();
      }
    });

    // Render
    this.renderNoteList();
    this.renderEditor();
    this.updateReflectionButton();
    this.updateReflectStyleDropdown();

    // Auto-start visual/audio for themed modes
    if (this.themeReflectionConfig[savedTheme]) {
      this.startVisualFx(savedTheme);
      this.startAudio(savedTheme);
    }

    // Auto-select first note if exists
    if (this.notes.length > 0) {
      this.selectNote(this.notes[0].id);
    }
  }

  // ========== THEME ==========
  setTheme(theme) {
    const prevTheme = this.els.app.dataset.theme;
    const wasReflecting = this.reflectionActive;
    this.els.app.dataset.theme = theme;
    Storage.setTheme(theme);

    // Stop effects when switching themes
    if (prevTheme !== theme) {
      if (this.reflectionActive) this.stopReflection();
      this.stopVisualFx();
      this.stopAudio();
    }

    this.updateReflectionButton();
    this.updateReflectStyleDropdown();

    // Auto-start visual/audio if theme supports it
    if (this.themeReflectionConfig[theme]) {
      this.startVisualFx(theme);
      this.startAudio(theme);

      // Persist reflection state across theme switches
      if (wasReflecting) {
        this.startReflection();
      }
    }
  }

  // ========== WEBCAM REFLECTION ==========
  updateReflectionButton() {
    const theme = this.els.app.dataset.theme;
    const hasReflection = !!this.themeReflectionConfig[theme];
    this.els.btnReflection.style.display = hasReflection ? '' : 'none';
    // Only show style dropdown when reflection is actually on
    this.els.reflectStyle.style.display = (hasReflection && this.reflectionActive) ? '' : 'none';
  }

  updateReflectStyleDropdown() {
    const theme = this.els.app.dataset.theme;
    const config = this.themeReflectionConfig[theme];
    if (!config) return;

    const sel = this.els.reflectStyle;
    sel.innerHTML = '';
    config.substyles.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.name;
      opt.textContent = s.label;
      sel.appendChild(opt);
    });
    sel.value = config.substyles[0].name;
  }

  getActiveSubstyleConfig() {
    const theme = this.els.app.dataset.theme;
    const config = this.themeReflectionConfig[theme];
    if (!config) return null;
    const selectedName = this.els.reflectStyle.value;
    return config.substyles.find(s => s.name === selectedName) || config.substyles[0];
  }

  setReflectionStyle(styleName) {
    const sub = this.getActiveSubstyleConfig();
    if (sub) {
      ImageProcessor.setStyle(sub.processorStyle);
      DXRenderer.setRenderStyle(sub.renderStyle);
      DXRenderer.setColorMode(sub.colorMode);
    } else {
      ImageProcessor.setStyle(styleName);
      DXRenderer.setRenderStyle(styleName);
    }
  }

  toggleReflection() {
    if (this.reflectionActive) {
      this.stopReflection();
    } else {
      this.startReflection();
    }
  }

  startReflection() {
    const container = this.els.editorContainer;
    if (!container) return;

    const theme = this.els.app.dataset.theme;
    const config = this.themeReflectionConfig[theme];
    const sub = this.getActiveSubstyleConfig();
    const colorMode = sub ? sub.colorMode : 'green';
    const opacity = config ? config.defaultOpacity : 0.35;
    const blendMode = config ? config.blendMode : 'screen';

    WebcamModule.init(320, 240);
    DXRenderer.init(container, { colorMode: colorMode, opacity: opacity });

    // Apply blend mode
    const overlay = container.querySelector('.dx-reflection-overlay');
    if (overlay) overlay.style.mixBlendMode = blendMode;

    // Set processor + renderer styles
    if (sub) {
      ImageProcessor.setStyle(sub.processorStyle);
      DXRenderer.setRenderStyle(sub.renderStyle);
    }

    WebcamModule.onFrame((imageData) => {
      const processed = ImageProcessor.processFrame(imageData);
      DXRenderer.renderFrame(processed);
    });

    WebcamModule.start().then(() => {
      this.reflectionActive = true;
      this.els.btnReflection.classList.add('active');
      this.els.reflectStyle.style.display = '';
    }).catch((err) => {
      console.warn('Webcam access denied:', err.message);
      DXRenderer.destroy();
    });
  }

  stopReflection() {
    WebcamModule.stop();
    DXRenderer.destroy();
    this.reflectionActive = false;
    this.els.btnReflection.classList.remove('active');
    this.els.reflectStyle.style.display = 'none';
  }

  // ========== VISUAL EFFECTS ==========
  startVisualFx(theme) {
    this.stopVisualFx();

    switch (theme) {
      case 'masseffect': this._fxHexGrid(); break;
      case 'startrek': this._fxLcarsScan(); break;
      case 'twinpeaks': this._fxRedCurtain(); break;
      case 'peanuts': this._fxFallingLeaves(); break;
      case 'warcraft': this._fxMagicDust(); break;
    }
  }

  stopVisualFx() {
    if (this.visualFxAnimId) {
      cancelAnimationFrame(this.visualFxAnimId);
      this.visualFxAnimId = null;
    }
    if (this.visualFxEl && this.visualFxEl.parentNode) {
      this.visualFxEl.parentNode.removeChild(this.visualFxEl);
    }
    this.visualFxEl = null;
    this.visualFxActive = false;
  }

  _createFxCanvas() {
    const c = document.createElement('canvas');
    c.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9997;';
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    document.body.appendChild(c);
    this.visualFxEl = c;
    this.visualFxActive = true;
    return c;
  }

  // Mass Effect: floating hex grid particles
  _fxHexGrid() {
    const c = this._createFxCanvas();
    const ctx = c.getContext('2d');
    const particles = [];
    for (let i = 0; i < 25; i++) {
      particles.push({
        x: Math.random() * c.width,
        y: Math.random() * c.height,
        size: 8 + Math.random() * 16,
        speed: 0.2 + Math.random() * 0.5,
        opacity: 0.03 + Math.random() * 0.06,
        angle: Math.random() * Math.PI * 2
      });
    }
    const draw = () => {
      if (!this.visualFxActive) return;
      ctx.clearRect(0, 0, c.width, c.height);
      particles.forEach(p => {
        p.y -= p.speed;
        p.x += Math.sin(p.angle) * 0.3;
        p.angle += 0.005;
        if (p.y < -30) { p.y = c.height + 30; p.x = Math.random() * c.width; }
        ctx.beginPath();
        ctx.strokeStyle = `rgba(0, 168, 255, ${p.opacity})`;
        ctx.lineWidth = 1;
        // Draw hexagon
        for (let s = 0; s < 6; s++) {
          const a = (Math.PI / 3) * s - Math.PI / 6;
          const hx = p.x + Math.cos(a) * p.size;
          const hy = p.y + Math.sin(a) * p.size;
          if (s === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
        }
        ctx.closePath();
        ctx.stroke();
      });
      this.visualFxAnimId = requestAnimationFrame(draw);
    };
    draw();
  }

  // Star Trek TNG: LCARS scanning line
  _fxLcarsScan() {
    const c = this._createFxCanvas();
    const ctx = c.getContext('2d');
    let y = 0;
    const draw = () => {
      if (!this.visualFxActive) return;
      ctx.clearRect(0, 0, c.width, c.height);
      const grad = ctx.createLinearGradient(0, y - 20, 0, y + 20);
      grad.addColorStop(0, 'rgba(255, 153, 102, 0)');
      grad.addColorStop(0.5, 'rgba(255, 153, 102, 0.08)');
      grad.addColorStop(1, 'rgba(255, 153, 102, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, y - 20, c.width, 40);
      y += 0.8;
      if (y > c.height + 30) y = -30;
      this.visualFxAnimId = requestAnimationFrame(draw);
    };
    draw();
  }

  // Twin Peaks: red curtain shimmer on edges
  _fxRedCurtain() {
    const c = this._createFxCanvas();
    const ctx = c.getContext('2d');
    let time = 0;
    const draw = () => {
      if (!this.visualFxActive) return;
      ctx.clearRect(0, 0, c.width, c.height);
      time += 0.02;
      // Left curtain
      for (let y = 0; y < c.height; y += 4) {
        const wave = Math.sin(y * 0.02 + time) * 8 + Math.sin(y * 0.05 + time * 1.3) * 4;
        const w = 20 + wave;
        const opacity = 0.04 + Math.sin(y * 0.01 + time * 0.5) * 0.02;
        ctx.fillStyle = `rgba(140, 20, 20, ${opacity})`;
        ctx.fillRect(0, y, w, 4);
      }
      // Right curtain
      for (let y = 0; y < c.height; y += 4) {
        const wave = Math.sin(y * 0.02 + time + 1) * 8 + Math.sin(y * 0.05 + time * 1.3 + 2) * 4;
        const w = 20 + wave;
        const opacity = 0.04 + Math.sin(y * 0.01 + time * 0.5 + 1) * 0.02;
        ctx.fillStyle = `rgba(140, 20, 20, ${opacity})`;
        ctx.fillRect(c.width - w, y, w, 4);
      }
      this.visualFxAnimId = requestAnimationFrame(draw);
    };
    draw();
  }

  // Peanuts: falling autumn leaves
  _fxFallingLeaves() {
    const c = this._createFxCanvas();
    const ctx = c.getContext('2d');
    const leaves = [];
    const colors = ['#e05030', '#c8a030', '#e08030', '#80a040', '#d06020'];
    for (let i = 0; i < 12; i++) {
      leaves.push({
        x: Math.random() * c.width,
        y: Math.random() * c.height,
        size: 4 + Math.random() * 6,
        speedY: 0.3 + Math.random() * 0.6,
        speedX: -0.2 + Math.random() * 0.4,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: -0.02 + Math.random() * 0.04,
        color: colors[Math.floor(Math.random() * colors.length)],
        wobble: Math.random() * Math.PI * 2
      });
    }
    const draw = () => {
      if (!this.visualFxActive) return;
      ctx.clearRect(0, 0, c.width, c.height);
      leaves.forEach(l => {
        l.y += l.speedY;
        l.wobble += 0.03;
        l.x += l.speedX + Math.sin(l.wobble) * 0.5;
        l.rot += l.rotSpeed;
        if (l.y > c.height + 20) { l.y = -20; l.x = Math.random() * c.width; }
        ctx.save();
        ctx.translate(l.x, l.y);
        ctx.rotate(l.rot);
        ctx.globalAlpha = 0.25;
        ctx.fillStyle = l.color;
        // Simple leaf shape
        ctx.beginPath();
        ctx.ellipse(0, 0, l.size, l.size * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      this.visualFxAnimId = requestAnimationFrame(draw);
    };
    draw();
  }

  // WoW: floating magic dust/sparkle particles
  _fxMagicDust() {
    const c = this._createFxCanvas();
    const ctx = c.getContext('2d');
    const sparks = [];
    for (let i = 0; i < 30; i++) {
      sparks.push({
        x: Math.random() * c.width,
        y: Math.random() * c.height,
        size: 1 + Math.random() * 2,
        speedY: -0.1 - Math.random() * 0.4,
        speedX: -0.1 + Math.random() * 0.2,
        life: Math.random(),
        lifeSpeed: 0.002 + Math.random() * 0.004,
        color: Math.random() > 0.5 ? 'rgba(200, 160, 48,' : 'rgba(120, 180, 255,'
      });
    }
    const draw = () => {
      if (!this.visualFxActive) return;
      ctx.clearRect(0, 0, c.width, c.height);
      sparks.forEach(s => {
        s.y += s.speedY;
        s.x += s.speedX;
        s.life += s.lifeSpeed;
        if (s.life > 1) s.life = 0;
        const alpha = Math.sin(s.life * Math.PI) * 0.4;
        if (s.y < -10 || s.life <= 0.01) {
          s.y = c.height + 10;
          s.x = Math.random() * c.width;
        }
        ctx.beginPath();
        ctx.fillStyle = s.color + alpha + ')';
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });
      this.visualFxAnimId = requestAnimationFrame(draw);
    };
    draw();
  }

  // ========== AUDIO FEATURES ==========
  _ensureAudioCtx() {
    if (!this.audioCtx) {
      this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (this.audioCtx.state === 'suspended') {
      this.audioCtx.resume();
    }
    return this.audioCtx;
  }

  startAudio(theme) {
    this.stopAudio();
    try {
      switch (theme) {
        case 'masseffect': this._audioMassEffect(); break;
        case 'startrek': this._audioStarTrek(); break;
        case 'twinpeaks': this._audioTwinPeaks(); break;
        case 'peanuts': this._audioPeanuts(); break;
        case 'warcraft': this._audioWarcraft(); break;
      }
      this.audioActive = true;
    } catch (e) {
      console.warn('Audio failed:', e.message);
    }
  }

  stopAudio() {
    // Clear any timers (e.g. Peanuts arpeggio)
    if (this.audioNodes._timer) {
      clearTimeout(this.audioNodes._timer);
      this.audioNodes._timer = null;
    }
    if (this.audioNodes.gain) {
      try { this.audioNodes.gain.gain.linearRampToValueAtTime(0, (this.audioCtx ? this.audioCtx.currentTime : 0) + 0.5); } catch(e) {}
    }
    // Clean up all nodes
    Object.values(this.audioNodes).forEach(node => {
      if (node === null || typeof node === 'number') return;
      try { if (node.stop) node.stop(); } catch(e) {}
      try { if (node.disconnect) node.disconnect(); } catch(e) {}
    });
    this.audioNodes = {};
    this.audioActive = false;
  }

  // Mass Effect: deep space ambient drone
  _audioMassEffect() {
    const ctx = this._ensureAudioCtx();
    const gain = ctx.createGain();
    gain.gain.value = 0.03;
    gain.connect(ctx.destination);

    const osc1 = ctx.createOscillator();
    osc1.type = 'sine';
    osc1.frequency.value = 55;
    const osc2 = ctx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = 82.5;
    const lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.1;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 3;

    lfo.connect(lfoGain);
    lfoGain.connect(osc1.frequency);
    osc1.connect(gain);
    osc2.connect(gain);
    osc1.start(); osc2.start(); lfo.start();

    this.audioNodes = { gain, osc1, osc2, lfo, lfoGain };
  }

  // Star Trek TNG: warp engine hum
  _audioStarTrek() {
    const ctx = this._ensureAudioCtx();
    const gain = ctx.createGain();
    gain.gain.value = 0.025;
    gain.connect(ctx.destination);

    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = 40;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 100;
    filter.Q.value = 5;

    const lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.05;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 10;
    lfo.connect(lfoGain);
    lfoGain.connect(filter.frequency);

    osc.connect(filter);
    filter.connect(gain);
    osc.start(); lfo.start();

    this.audioNodes = { gain, osc, filter, lfo, lfoGain };
  }

  // Twin Peaks: eerie ambient wind/drone
  _audioTwinPeaks() {
    const ctx = this._ensureAudioCtx();
    const gain = ctx.createGain();
    gain.gain.value = 0.02;
    gain.connect(ctx.destination);

    // Create noise buffer
    const bufferSize = ctx.sampleRate * 2;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    noise.loop = true;

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 200;
    filter.Q.value = 2;

    const lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.08;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 80;
    lfo.connect(lfoGain);
    lfoGain.connect(filter.frequency);

    noise.connect(filter);
    filter.connect(gain);
    noise.start(); lfo.start();

    this.audioNodes = { gain, noise, filter, lfo, lfoGain };
  }

  // Peanuts: soft jazz piano-esque tones (simple arpeggio)
  _audioPeanuts() {
    const ctx = this._ensureAudioCtx();
    const gain = ctx.createGain();
    gain.gain.value = 0.02;
    gain.connect(ctx.destination);

    // Gentle repeating piano-like notes using triangle waves
    const notes = [261.6, 329.6, 392.0, 440.0, 392.0, 329.6]; // C E G A G E
    let noteIdx = 0;

    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = notes[0];

    const noteGain = ctx.createGain();
    noteGain.gain.value = 0;
    osc.connect(noteGain);
    noteGain.connect(gain);
    osc.start();

    // Schedule gentle note changes
    const playNote = () => {
      if (!this.audioActive) return;
      const now = ctx.currentTime;
      osc.frequency.setValueAtTime(notes[noteIdx], now);
      noteGain.gain.setValueAtTime(0, now);
      noteGain.gain.linearRampToValueAtTime(1, now + 0.05);
      noteGain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
      noteIdx = (noteIdx + 1) % notes.length;
      this.audioNodes._timer = setTimeout(playNote, 2000);
    };
    playNote();

    this.audioNodes = { gain, osc, noteGain, _timer: null };
  }

  // WoW: fantasy ambient — low strings + occasional sparkle
  _audioWarcraft() {
    const ctx = this._ensureAudioCtx();
    const gain = ctx.createGain();
    gain.gain.value = 0.03;
    gain.connect(ctx.destination);

    const osc1 = ctx.createOscillator();
    osc1.type = 'sawtooth';
    osc1.frequency.value = 65.4; // C2
    const osc2 = ctx.createOscillator();
    osc2.type = 'sawtooth';
    osc2.frequency.value = 98.0; // G2

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 150;
    filter.Q.value = 1;

    const lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.06;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 20;
    lfo.connect(lfoGain);
    lfoGain.connect(filter.frequency);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gain);
    osc1.start(); osc2.start(); lfo.start();

    this.audioNodes = { gain, osc1, osc2, filter, lfo, lfoGain };
  }

  // ========== NOTE CRUD ==========
  createNote() {
    const note = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      content: '',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      // P1 reminders: reminder: { date: null, sent: false }
    };
    this.notes.unshift(note);
    Storage.save(this.notes);
    this.selectNote(note.id);
    this.renderNoteList();
  }

  deleteActiveNote() {
    if (!this.activeNoteId) return;
    const idx = this.notes.findIndex(n => n.id === this.activeNoteId);
    if (idx === -1) return;

    this.notes.splice(idx, 1);
    Storage.save(this.notes);

    // Select adjacent note
    if (this.notes.length > 0) {
      const nextIdx = Math.min(idx, this.notes.length - 1);
      this.selectNote(this.notes[nextIdx].id);
    } else {
      this.activeNoteId = null;
      this.renderEditor();
    }
    this.renderNoteList();
  }

  selectNote(id) {
    // Save current note before switching
    this.flushSave();

    this.activeNoteId = id;
    this.renderEditor();
    this.renderNoteList();

    // Focus textarea
    const textarea = this.els.editorContainer.querySelector('.editor-textarea');
    if (textarea) {
      textarea.focus();
    }
  }

  getActiveNote() {
    return this.notes.find(n => n.id === this.activeNoteId) || null;
  }

  getTitle(note) {
    if (!note || !note.content) return 'Untitled';
    const firstLine = note.content.split('\n')[0].trim();
    return firstLine || 'Untitled';
  }

  getPreview(note) {
    if (!note || !note.content) return 'Empty note';
    const lines = note.content.split('\n');
    const preview = lines.slice(1).join(' ').trim();
    return preview || 'No additional text';
  }

  formatDate(isoStr) {
    const d = new Date(isoStr);
    const now = new Date();
    const diffMs = now - d;
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);

    if (diffMins < 1) return 'Just now';
    if (diffMins < 60) return `${diffMins}m ago`;
    if (diffHours < 24) return `${diffHours}h ago`;
    if (diffDays < 7) return `${diffDays}d ago`;
    return d.toLocaleDateString();
  }

  // ========== AUTO-SAVE ==========
  scheduleSave(note) {
    clearTimeout(this.saveTimeout);
    this.els.saveIndicator.textContent = 'Editing...';

    this.saveTimeout = setTimeout(() => {
      note.updatedAt = new Date().toISOString();
      Storage.save(this.notes);
      this.els.saveIndicator.textContent = 'Saved';
      this.els.saveIndicator.classList.add('saving');
      setTimeout(() => {
        this.els.saveIndicator.textContent = '';
        this.els.saveIndicator.classList.remove('saving');
      }, 1500);

      // Update sidebar title/preview
      this.renderNoteList();
    }, 400);
  }

  flushSave() {
    if (this.saveTimeout) {
      clearTimeout(this.saveTimeout);
      this.saveTimeout = null;
      const note = this.getActiveNote();
      if (note) {
        note.updatedAt = new Date().toISOString();
        Storage.save(this.notes);
      }
    }
  }

  // ========== RENDER ==========
  renderNoteList() {
    const filtered = this.searchQuery
      ? this.notes.filter(n =>
          n.content.toLowerCase().includes(this.searchQuery) ||
          this.getTitle(n).toLowerCase().includes(this.searchQuery)
        )
      : this.notes;

    this.els.noteList.innerHTML = filtered.map(note => `
      <div class="note-item ${note.id === this.activeNoteId ? 'active' : ''}"
           data-note-id="${note.id}">
        <div class="note-item-title">${this.escapeHtml(this.getTitle(note))}</div>
        <div class="note-item-preview">${this.escapeHtml(this.getPreview(note))}</div>
        <div class="note-item-date">${this.formatDate(note.updatedAt)}</div>
      </div>
    `).join('');

    // Attach click handlers
    this.els.noteList.querySelectorAll('.note-item').forEach(el => {
      el.addEventListener('click', () => {
        this.selectNote(el.dataset.noteId);
      });
    });

    // Update count
    const total = this.notes.length;
    const shown = filtered.length;
    this.els.noteCount.textContent = this.searchQuery
      ? `${shown} of ${total} notes`
      : `${total} note${total !== 1 ? 's' : ''}`;
  }

  renderEditor() {
    const note = this.getActiveNote();

    if (!note) {
      this.els.editorContainer.innerHTML = `<div class="empty-state" id="empty-state">Select a note or create a new one</div>`;
      this.els.titleDisplay.textContent = '';
      this.els.saveIndicator.textContent = '';
      this.els.btnDelete.style.display = 'none';
      return;
    }

    this.els.btnDelete.style.display = '';
    this.els.titleDisplay.textContent = this.getTitle(note);
    this.els.saveIndicator.textContent = '';

    this.els.editorContainer.innerHTML = `
      <textarea class="editor-textarea" id="editor-textarea"
        placeholder="Start typing..."
        data-note-id="${note.id}"
      >${this.escapeHtml(note.content)}</textarea>
    `;

    const textarea = this.els.editorContainer.querySelector('.editor-textarea');
    textarea.addEventListener('input', (e) => {
      note.content = e.target.value;
      this.els.titleDisplay.textContent = this.getTitle(note);
      this.scheduleSave(note);
    });
  }

  escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
}

// ========== BOOT ==========
const app = new NotesApp();

// Expose for testing
window.__notesApp = app;
</script>
</body>
</html>
